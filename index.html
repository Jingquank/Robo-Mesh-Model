<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Robo Mesh Model — Ivory Mannequin Android</title>
<style>
  :root {
    --bg: #f2f3f5;
    --panel: #fafbfc;
    --panel-edge: #e3e5e9;
    --text: #26282c;
    --text-dim: #7b7f88;
    --accent: #2b6cff;
    --ok: #1d8a4e;
    --fail: #c33535;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.45 system-ui, -apple-system, sans-serif;
    overflow: hidden;
  }
  #app { display: flex; height: 100%; }
  #viewport { position: relative; flex: 1; min-width: 0; }
  #viewport canvas { display: block; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .jlabel {
    font: 10px/1 var(--mono);
    color: #1c3f8f;
    background: rgba(255, 255, 255, 0.85);
    border: 1px solid rgba(43, 108, 255, 0.35);
    border-radius: 3px;
    padding: 1px 4px;
    white-space: nowrap;
    transform: translate(8px, -50%);
  }
  #panel {
    width: 304px;
    flex: none;
    background: var(--panel);
    border-left: 1px solid var(--panel-edge);
    overflow-y: auto;
    padding: 18px 16px 28px;
  }
  #panel header { margin-bottom: 16px; }
  #panel h1 { font-size: 15px; font-weight: 650; letter-spacing: 0.01em; }
  #panel header p { color: var(--text-dim); font-size: 12px; margin-top: 3px; }
  #panel h2 {
    font-size: 10.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.09em; color: var(--text-dim);
    margin: 18px 0 8px;
  }
  .stats { display: flex; gap: 8px; }
  .stats > div {
    flex: 1; background: #fff; border: 1px solid var(--panel-edge);
    border-radius: 6px; padding: 8px 6px 7px; text-align: center;
  }
  .stats span { display: block; font: 600 15px var(--mono); color: var(--text); }
  .stats label { display: block; margin-top: 2px; font-size: 10px; color: var(--text-dim); }
  .row { display: flex; align-items: center; gap: 8px; padding: 4px 0; }
  .row label { user-select: none; cursor: pointer; }
  .row small { color: var(--text-dim); }
  input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }
  button {
    display: block; width: 100%; margin: 6px 0;
    background: #fff; color: var(--text);
    border: 1px solid var(--panel-edge); border-radius: 6px;
    padding: 8px 10px; font: 500 12.5px system-ui; cursor: pointer;
    text-align: left;
  }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.55; cursor: default; }
  button.primary { background: #eef3ff; border-color: #b9ccf5; }
  button small { float: right; color: var(--text-dim); font: 11px var(--mono); }
  #badge {
    display: inline-block; margin: 8px 0 4px;
    font: 600 11px var(--mono); border-radius: 4px; padding: 3px 8px;
  }
  #badge.ok { background: rgba(29, 138, 78, 0.1); color: var(--ok); border: 1px solid rgba(29, 138, 78, 0.35); }
  #badge.fail { background: rgba(195, 53, 53, 0.08); color: #c33535; border: 1px solid rgba(195, 53, 53, 0.35); }
  #badge.wait { background: rgba(123, 127, 136, 0.1); color: var(--text-dim); border: 1px solid var(--panel-edge); }
  #report {
    font: 10.5px/1.6 var(--mono); color: var(--text-dim);
    background: #fff; border: 1px solid var(--panel-edge); border-radius: 6px;
    padding: 8px; margin-top: 6px; white-space: pre-wrap; word-break: break-word;
    max-height: 180px; overflow-y: auto;
  }
  #tree { font: 11px/1.7 var(--mono); }
  #tree details { padding-left: 12px; }
  #tree > details { padding-left: 0; }
  #tree summary { cursor: pointer; color: var(--text); }
  #tree summary::marker { color: var(--text-dim); }
  #tree .leaf { padding-left: 24px; color: var(--text-dim); }
  #err {
    position: absolute; inset: auto 12px 12px 12px; z-index: 9;
    background: #fdeeee; border: 1px solid #e2a5a5; border-radius: 6px;
    color: #a52a2a; font: 11px var(--mono); padding: 10px; display: none;
    white-space: pre-wrap;
  }
  body.review #panel { display: none; }
</style>
<script>
  // Registered before the module so load-time failures are never silent.
  (function () {
    function show(msg) {
      var el = document.getElementById('err');
      if (el) { el.style.display = 'block'; el.textContent = 'Error: ' + msg; }
      var badge = document.getElementById('badge');
      if (badge && /LOADING|VALIDATING/.test(badge.textContent)) {
        badge.className = 'fail';
        badge.textContent = 'LOAD FAILED';
      }
    }
    addEventListener('error', function (e) { show(e.message || String(e.error || e)); });
    addEventListener('unhandledrejection', function (e) {
      show((e.reason && e.reason.message) || String(e.reason));
    });
  })();
</script>
</head>
<body>
<div id="app">
  <div id="viewport"><div id="err"></div></div>
  <aside id="panel">
    <header>
      <h1>Ivory Mannequin Android</h1>
      <p>Ball-jointed figure — T-pose bind, Y-up, centimeters</p>
    </header>

    <section class="stats">
      <div><span id="stat-joints">–</span><label>joints</label></div>
      <div><span id="stat-tris">–</span><label>triangles</label></div>
      <div><span id="stat-height">–</span><label>height cm</label></div>
    </section>

    <h2>Display</h2>
    <div class="row"><input type="checkbox" id="cb-stance" checked><label for="cb-stance">Reference A-pose <small>(viewer only)</small></label></div>
    <div class="row"><input type="checkbox" id="cb-wire"><label for="cb-wire">Wireframe</label></div>
    <div class="row"><input type="checkbox" id="cb-skel"><label for="cb-skel">Skeleton (bones + joints)</label></div>
    <div class="row"><input type="checkbox" id="cb-labels"><label for="cb-labels">Joint name labels</label></div>

    <h2>Export</h2>
    <div class="row"><input type="checkbox" id="cb-prefix"><label for="cb-prefix">mixamorig: name prefix</label></div>
    <button id="btn-ascii" class="primary">Download FBX <small>ASCII 7.4</small></button>
    <button id="btn-bin">Download FBX <small>binary 7.4</small></button>
    <button id="btn-glb">Download GLB <small>meters</small></button>
    <div><span id="badge" class="wait">LOADING…</span></div>
    <div id="report">waiting for module…</div>

    <h2>Hierarchy</h2>
    <div id="tree"></div>
  </aside>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const PARAMS = new URLSearchParams(location.search);
// Build stages mirror the sculpt-spec passes: 1 blockout (macro shells),
// 2 structure (all meso parts), 3 features (micro seams + hardware),
// 4 materials (ivory/brass/liner), 5 final lighting plate.
const STAGE = Math.min(5, Math.max(1, parseInt(PARAMS.get('stage') || '5', 10) || 5));
const REVIEW = PARAMS.get('review'); // front | tq | profile | hands

/* ============================================================
 * 1. RIG — full Mixamo humanoid, 52 joints (15 finger joints
 *    per hand), world positions in cm. Rest rotations are
 *    identity everywhere: a bone's local transform is the pure
 *    translation childWorld - parentWorld. Bind pose is a
 *    strict T-pose: arms along ±X, legs down -Y, facing +Z.
 *    Proportions follow the reference plate: 175 cm tall,
 *    9.3 head-units, crotch at 49% of height.
 * ============================================================ */
const JOINTS = (() => {
  const j = [];
  const add = (name, parent, x, y, z) => j.push({ name, parent, pos: [x, y, z] });
  add('Hips', null, 0, 97, 0);
  add('Spine', 'Hips', 0, 106, 0);
  add('Spine1', 'Spine', 0, 116, 0);
  add('Spine2', 'Spine1', 0, 126, 0);
  add('Neck', 'Spine2', 0, 146.6, 0);
  add('Head', 'Neck', 0, 156.2, 0);
  for (const [S, s] of [['Left', 1], ['Right', -1]]) {
    add(S + 'Shoulder', 'Spine2', s * 6.5, 142.5, 0);
    add(S + 'Arm', S + 'Shoulder', s * 18, 140.5, 0);
    add(S + 'ForeArm', S + 'Arm', s * 48.0, 140.5, 0);
    add(S + 'Hand', S + 'ForeArm', s * 68.9, 140.5, 0);
    add(S + 'HandThumb1', S + 'Hand', s * 70.80, 139.49, 2.80);
    add(S + 'HandThumb2', S + 'HandThumb1', s * 73.16, 138.82, 4.70);
    add(S + 'HandThumb3', S + 'HandThumb2', s * 74.95, 138.37, 6.16);
    add(S + 'HandIndex1', S + 'Hand', s * 74.16, 140.5, 2.46);
    add(S + 'HandIndex2', S + 'HandIndex1', s * 76.96, 140.5, 2.55);
    add(S + 'HandIndex3', S + 'HandIndex2', s * 79.09, 140.5, 2.62);
    add(S + 'HandMiddle1', S + 'Hand', s * 74.61, 140.5, 0.73);
    add(S + 'HandMiddle2', S + 'HandMiddle1', s * 77.64, 140.5, 0.73);
    add(S + 'HandMiddle3', S + 'HandMiddle2', s * 79.93, 140.5, 0.73);
    add(S + 'HandRing1', S + 'Hand', s * 74.28, 140.5, -1.06);
    add(S + 'HandRing2', S + 'HandRing1', s * 77.02, 140.5, -1.15);
    add(S + 'HandRing3', S + 'HandRing2', s * 79.09, 140.5, -1.22);
    add(S + 'HandPinky1', S + 'Hand', s * 73.38, 140.5, -2.74);
    add(S + 'HandPinky2', S + 'HandPinky1', s * 75.62, 140.5, -2.87);
    add(S + 'HandPinky3', S + 'HandPinky2', s * 77.36, 140.5, -2.96);
  }
  for (const [S, s] of [['Left', 1], ['Right', -1]]) {
    add(S + 'UpLeg', 'Hips', s * 8.3, 93, 0);
    add(S + 'Leg', S + 'UpLeg', s * 8.3, 52.6, 0);
    add(S + 'Foot', S + 'Leg', s * 8.3, 15.4, 0);
    add(S + 'ToeBase', S + 'Foot', s * 8.3, 2.8, 9.5);
  }
  return j;
})();
const JINDEX = new Map(JOINTS.map((j, i) => [j.name, i]));
const MESH_NAME = 'IvoryMannequin';

/* ============================================================
 * 2. MATERIALS — three slots, exported per-polygon.
 *    0 shell: warm ivory satin composite
 *    1 brass: polished hinge hardware (wrist pins, knuckles,
 *      finger rings, knee/ankle pin discs)
 *    2 liner: dark warm socket liner / seam grooves
 * ============================================================ */
const MATERIALS = [
  { key: 'IvoryShell', color: [0.902, 0.847, 0.776], metalness: 0.0, roughness: 0.5, shininess: 18 },
  { key: 'BrassHardware', color: [0.604, 0.478, 0.29], metalness: 1.0, roughness: 0.3, shininess: 60 },
  { key: 'SocketLiner', color: [0.29, 0.22, 0.149], metalness: 0.0, roughness: 0.85, shininess: 4 },
];

/* ============================================================
 * 3. BODY PARTS
 *    kind: shell (ring lathe with shaped edges) | sph | cyl |
 *    rbox | link | tube (surface seam line) | ext (side-profile
 *    extrude for foot/toe). Every part is rigidly skinned to
 *    one bone (shell rows may split across two spine bones).
 *    stage tags parts into build passes; exports always build
 *    the full model.
 * ============================================================ */
const FRONT = 0; // shell phi=0 faces +Z

const PARTS = (() => {
  const p = [];
  const J = name => JOINTS[JINDEX.get(name)].pos;
  const shell = (bone, o) => p.push({ kind: 'shell', bone, mat: 0, rs: 14, stage: 1, ...o });
  // exposed balls, pauldron petals, palm domes are silhouette parts → stage 1
  const sph = (bone, o) => p.push({ kind: 'sph', bone, mat: 0, stage: 1, ...o });
  const cyl = (bone, o) => p.push({ kind: 'cyl', bone, axis: 'x', mat: 1, stage: 3, ...o });
  const box = (bone, o) => p.push({ kind: 'rbox', bone, seg: 1, mat: 1, stage: 3, ...o });
  const link = (bone, from, to, r, o) => p.push({ kind: 'link', bone, from, to, r, seg: 'xs', mat: 0, stage: 1, ...o });
  const tube = (bone, pts, r, o) => p.push({ kind: 'tube', bone, pts, r, mat: 2, stage: 3, ...o });

  /* ---- head: egg revolved profile, depth-biased ---- */
  shell('Head', {
    sid: 'head',
    prof: [[156.4, 2.0], [158.2, 3.25], [160.4, 4.15], [163.0, 4.75], [165.6, 5.0],
           [168.2, 5.0], [170.8, 4.65], [173.2, 3.8], [174.3, 3.0], [174.8, 1.7], [175.0, 0.02]],
    sclX: 1.03, sclZ: 1.22, rs: 14, closedBottom: true,
  });
  // face-plate seam: oval on the egg surface, front hemisphere
  p.push({ kind: 'faceRing', sid: 'head/face-plate-seam', relief: true, bone: 'Head', mat: 2, stage: 3 });

  /* ---- neck: tapered column flowing into collar ---- */
  shell('Neck', {
    sid: 'neck',
    prof: [[144.6, 3.4], [146.4, 2.95], [148.4, 2.6], [151.0, 2.4], [153.6, 2.42], [155.6, 2.35], [156.8, 2.2]],
    sclZ: 1.15, rs: 12,
  });
  p.push({ kind: 'torus', sid: 'neck', bone: 'Neck', mat: 0, stage: 2,
           R: 2.9, tr: 0.42, at: [0, 146.7, 0], scl: [1, 0.7, 1.15], seg: [10, 4] }); // collar ring the neck seats into
  p.push({ kind: 'torus', sid: 'neck/collar-seam', relief: true, bone: 'Neck', mat: 2, stage: 3,
           R: 2.66, tr: 0.08, at: [0, 146.85, 0], scl: [1, 1, 1.15], seg: [12, 3] });

  /* ---- chest plate: smile under-edge, collar opening ---- */
  shell('Spine2', {
    sid: 'torsoChest',
    prof: [[124.8, 10.15], [127.0, 10.55], [129.5, 10.8], [132.0, 10.9], [135.0, 10.85],
           [138.0, 10.55], [140.6, 10.1], [142.8, 9.4], [144.8, 8.4], [146.2, 6.6], [147.7, 3.9]],
    sclX: 1.025, sclZ: 0.63, rs: 14, lip: true, lipDy: 0.45, lipR: 0.9,
    botEdge: phi => 2.6 * (1 - Math.cos(phi)) / 2 * (Math.abs(wrapPi(phi)) < 2.1 ? 1 : 0.55) + smileBack(phi),
    topEdge: phi => { // small clavicle notch at the front; traps stay high
      const a = wrapPi(phi);
      return -0.6 * bump(a, 0, 0.7) - 0.4 * bump(Math.abs(a), Math.PI, 0.7);
    },
    edgeFade: 0.32,
  });
  // clavicle yoke: shoulder shelf spanning collar to shoulder caps
  p.push({ kind: 'sph', sid: 'torsoChest', bone: 'Spine2', mat: 0, stage: 1,
           r: 7.4, at: [0, 143.6, 0.2], scl: [1.92, 0.38, 0.74], ws: 12, hs: 5 });
  // dark undercut line tracing the smile edge over the belly plate
  p.push({ kind: 'edgeTube', sid: 'torsoChest/under-edge-gap', relief: true, bone: 'Spine2', mat: 2, stage: 3,
           baseY: 124.8, r: 10.15, sclX: 1.025, sclZ: 0.63, dy: -0.3, rIn: 0.985, tr: 0.13, seg: 14,
           edge: phi => 2.6 * (1 - Math.cos(phi)) / 2 * (Math.abs(wrapPi(phi)) < 2.1 ? 1 : 0.55) + smileBack(phi) });

  /* ---- belly plate: waist pinch, egg swell; spans two spine bones ---- */
  shell('Spine1', {
    sid: 'torsoBelly',
    prof: [[101.2, 10.55], [104.0, 10.25], [107.5, 9.8], [111.0, 9.4], [114.0, 9.3],
           [116.3, 9.2], [118.5, 9.35], [121.0, 9.45], [124.0, 9.8], [126.6, 10.0]],
    sclX: 1.025, sclZ: 0.63, rs: 14,
    boneByY: [[110.5, 'Spine'], [Infinity, 'Spine1']],
    botEdge: phi => -1.0 * bump(wrapPi(phi), 0, 0.9),
    edgeFade: 0.22,
  });

  /* ---- pelvis briefs: W top edge, V crotch, leg arches ---- */
  shell('Hips', {
    sid: 'pelvis',
    prof: [[88.3, 9.8], [89.8, 11.6], [92.0, 13.4], [94.5, 14.4], [96.5, 14.2],
           [98.5, 13.5], [100.2, 12.9], [101.4, 12.2]],
    sclX: 1.045, sclZ: 0.55, rs: 16, lip: true,
    topEdge: phi => {
      const a = wrapPi(phi);
      return 0.55 * (bump(a, 0.82, 0.8) + bump(a, -0.82, 0.8)) - 0.7 * bump(a, 0, 0.55)
           + 0.5 * bump(Math.abs(a), Math.PI, 1.1);
    },
    botEdge: phi => {
      const a = wrapPi(phi);
      return 4.0 * (bump(a, 1.05, 0.72) + bump(a, -1.05, 0.72)) - 0.2 * bump(a, 0, 0.5)
           + 1.6 * bump(Math.abs(a), Math.PI, 1.4);
    },
    edgeFade: 0.42,
  });
  p.push({ kind: 'edgeTube', sid: 'pelvis/w-top-edge', relief: true, bone: 'Hips', mat: 2, stage: 3,
           baseY: 101.4, r: 12.2, sclX: 1.045, sclZ: 0.55, dy: -0.26, rIn: 0.972, tr: 0.13, seg: 14,
           edge: phi => {
             const a = wrapPi(phi);
             return 0.55 * (bump(a, 0.82, 0.8) + bump(a, -0.82, 0.8)) - 0.7 * bump(a, 0, 0.55)
                  + 0.5 * bump(Math.abs(a), Math.PI, 1.1);
           } });

  /* ---- hip socket liners: dark spheres in the cutout gap ---- */
  for (const [S, s] of [['Left', 1], ['Right', -1]]) {
    sph(S + 'UpLeg', { sid: 'hipSocket', r: 4.3, at: [s * 8.3, 92.4, 0], ws: 6, hs: 4, mat: 2 });
  }

  for (const [S, s] of [['Left', 1], ['Right', -1]]) {
    /* ---- shoulder pauldrons: two layered petal caps ---- */
    sph(S + 'Shoulder', { sid: 'pauldronPetalUpper', r: 5.3, at: [s * 15.6, 143.7, 0], scl: [1, 0.58, 1.06],
      ws: 10, hs: 5, thetaLength: 2.35, rotZ: s * -0.3 });
    sph(S + 'Shoulder', { sid: 'pauldronPetalUpper/petal-gap', relief: true, r: 4.35, at: [s * 16.1, 142.6, 0], scl: [1, 0.5, 0.98],
      ws: 8, hs: 3, thetaLength: 2.0, rotZ: s * -0.36, mat: 2 });
    sph(S + 'Shoulder', { sid: 'pauldronPetalLower', r: 4.6, at: [s * 17.8, 141.4, 0], scl: [1, 0.55, 1.05],
      ws: 10, hs: 5, thetaLength: 2.3, rotZ: s * -0.48 });

    /* ---- upper arm: tapered clamshell along +X (T-pose) ---- */
    shell(S + 'Arm', {
      sid: 'upperArm',
      prof: [[-2.2, 3.5], [1.5, 4.1], [6.0, 4.0], [11.0, 3.74], [16.0, 3.48], [21.0, 3.12], [26.0, 2.84], [28.6, 2.72]],
      rs: 11, axis: 'x', sgn: s, org: J(S + 'Arm'), sclZ: 1.0, lipEnd: true,
    });
    tube(S + 'Arm', limbSeam(J(S + 'Arm'), s, [[1.2, 3.47], [9, 3.46], [16, 3.15], [23, 2.8], [28.2, 2.6]], 0.42), 0.095, { sid: 'upperArm/upperarm-seam', relief: true });

    /* ---- elbow ball ---- */
    sph(S + 'ForeArm', { sid: 'elbowBall', r: 2.85, at: [s * 48.0, 140.5, 0], ws: 9, hs: 6 });

    /* ---- forearm: cradle, slim wrist, offset lip ---- */
    shell(S + 'ForeArm', {
      sid: 'forearm',
      prof: [[1.6, 2.82], [3.0, 3.02], [6.0, 2.9], [9.5, 2.68], [13.0, 2.4],
             [16.2, 2.08], [18.3, 1.95], [18.6, 2.07], [19.4, 1.82]],
      rs: 11, axis: 'x', sgn: s, org: J(S + 'ForeArm'), sclZ: 1.0, lip: true, lipEnd: true,
    });
    tube(S + 'ForeArm', limbSeam(J(S + 'ForeArm'), s, [[2.1, 2.68], [7, 2.58], [12, 2.3], [16, 2.0], [18.9, 1.8]], 0.42), 0.09, { sid: 'forearm/forearm-seam', relief: true });

    /* ---- wrist: brass pin collar ---- */
    cyl(S + 'Hand', { sid: 'wristPin', r: 0.95, h: 2.6, at: [s * 68.5, 140.5, 0] });

    /* ---- palm: back-of-hand dome + thumb root ball ---- */
    sph(S + 'Hand', { sid: 'palm', r: 2.1, at: [s * 71.0, 140.35, 0.1], scl: [1.95, 0.44, 1.62], ws: 10, hs: 6 });
    sph(S + 'Hand', { sid: 'palm/thumb-ball', r: 1.05, at: [s * 69.9, 139.8, 2.2], ws: 7, hs: 5 });

    /* ---- brass knuckle row at the MCP line ---- */
    for (const z of [2.2, 0.65, -0.95, -2.45]) {
      box(S + 'Hand', { sid: 'knuckleRow', w: 0.9, h: 0.75, d: 0.92, rad: 0.16, at: [s * 74.1, 141.15, z * 1.12] });
    }

    /* ---- fingers: capsule phalanges + brass hinge rings ---- */
    const radii = { Thumb: 0.66, Index: 0.62, Middle: 0.64, Ring: 0.58, Pinky: 0.5 };
    for (const f of Object.keys(radii)) {
      for (let i = 1; i <= 3; i++) {
        const a = J(S + 'Hand' + f + i);
        let b;
        if (i < 3) b = J(S + 'Hand' + f + (i + 1));
        else {
          const prev = J(S + 'Hand' + f + (i - 1));

function wrapPi(a) { a = a % (Math.PI * 2); return a > Math.PI ? a - Math.PI * 2 : a < -Math.PI ? a + Math.PI * 2 : a; }

/* ============================================================
 * 4. GEOMETRY BUILDERS
 * ============================================================ */
// Ring-lathe shell with per-angle shaped edges. prof: [[y|d, r], ...]
// bottom→top in local units; axis 'y' hangs the profile below org,
// axis 'x' lays it along ±X from org. topEdge/botEdge(phi) shift the
// edge rings with a smooth falloff (edgeFade fraction of the profile).
// lip folds the open rim inward so panel edges read with thickness.
function shellGeometry(part) {
  const rs = part.rs, prof = part.prof.slice();
  const sclX = part.sclX ?? 1, sclZ = part.sclZ ?? 1;
  const rows0 = prof.length;
  const y0 = prof[0][0], y1 = prof[rows0 - 1][0];
  const span = y1 - y0 || 1;
  const pos = [], uv = [];
  const rings = [];
  for (let i = 0; i < rows0; i++) rings.push({ y: prof[i][0], r: prof[i][1], t: (prof[i][0] - y0) / span, edge: 1 });
  if (part.lip) {
    const first = rings[0];
    rings.unshift({ y: first.y + (part.lipDy ?? 0.5), r: first.r * (part.lipR ?? 0.86), t: first.t, edge: 1 });
  }
  if (part.lipEnd) {
    const last = rings[rings.length - 1];
    rings.push({ y: last.y - (part.lipDy ?? 0.5), r: last.r * (part.lipR ?? 0.86), t: last.t, edge: 1 });
  }
  const fade = part.edgeFade ?? 0.25;
  const wgt = t => Math.max(0, 1 - t / fade);
  for (const ring of rings) {
    for (let j = 0; j < rs; j++) {
      const phi = j / rs * Math.PI * 2;
      let y = ring.y;
      if (part.botEdge) y += part.botEdge(phi) * wgt(ring.t) * ring.edge;
      if (part.topEdge) y += part.topEdge(phi) * wgt(1 - ring.t) * ring.edge;

      let py = y;
      let pz = Math.cos(phi) * ring.r * sclZ;

  const rows = rings.length;
  for (let i = 0; i < rows - 1; i++) {
    for (let j = 0; j < rs; j++) {
      const a = i * rs + j, b = i * rs + (j + 1) % rs;
      const c = (i + 1) * rs + j, d = (i + 1) * rs + (j + 1) % rs;
      idx.push(a, c, b, b, c, d);
    }

  }

  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));

  }
  if (part.org) g.translate(part.org[0], part.org[1], part.org[2]);
  g.computeVertexNormals();

}

function faceRingGeometry() {

  const prof = [[156.4, 2.0], [158.2, 3.25], [160.4, 4.15], [163.0, 4.75], [165.6, 5.0],

      if (y >= y0 && y <= y1) return r0 + (r1 - r0) * (y - y0) / (y1 - y0);

// Capsules/lathes emit zero-area triangles at poles. Strip them (and
// orphaned vertices) so exports carry no degenerate polygons; the
// per-triangle material array is filtered in the same pass.
function stripDegenerateTriangles(g, triMat) {
  const pos = g.attributes.position;
  const idx = g.index.array;

  const ab = new THREE.Vector3(), ac = new THREE.Vector3(), cr = new THREE.Vector3();

    b.fromBufferAttribute(pos, idx[i + 1]);
    c.fromBufferAttribute(pos, idx[i + 2]);
    ab.subVectors(b, a); ac.subVectors(c, a); cr.crossVectors(ab, ac);
    if (cr.lengthSq() > 1e-14) {
      keep.push(idx[i], idx[i + 1], idx[i + 2]);
      keptMat.push(triMat[i / 3]);
    }

  g.setIndex(keep);
  compactVertices(g);
  return Int32Array.from(keptMat);
}

// Drop vertices no triangle references (pole duplicates whose only faces were
// degenerate) so DCCs see no loose vertices or weights on unused points.
function compactVertices(g) {
  const idx = g.index.array;
  const count = g.attributes.position.count;
  const remap = new Int32Array(count).fill(-1);
  let n = 0;
  for (let i = 0; i < idx.length; i++) if (remap[idx[i]] < 0) remap[idx[i]] = 0;
  for (let i = 0; i < count; i++) if (remap[i] === 0) remap[i] = n++;
  if (n === count) return g;
  for (const name of Object.keys(g.attributes)) {
    const a = g.attributes[name];
    const arr = new a.array.constructor(n * a.itemSize);
    for (let i = 0; i < count; i++) {
      if (remap[i] < 0) continue;
      for (let k = 0; k < a.itemSize; k++) arr[remap[i] * a.itemSize + k] = a.array[i * a.itemSize + k];
    }

function buildBody(scale, stage = 5) {
  const parts = [];

  for (const part of PARTS) {
    if ((part.stage ?? 1) > stage) continue;
    const g = partGeometry(part, scale);
    const n = g.attributes.position.count;
    const si = new Uint16Array(n * 4);
    const sw = new Float32Array(n * 4);
    if (part.boneByY) {
      // shell rows split across spine bones by world height (still rigid per vertex)
      const pos = g.attributes.position;
      for (let i = 0; i < n; i++) {
        const y = pos.getY(i) / scale;
        let bone = part.bone;
        for (const [cut, name] of part.boneByY) { if (y < cut) { bone = name; break; } }

      }
    } else {
      const boneIndex = JINDEX.get(part.bone);
      for (let i = 0; i < n; i++) { si[i * 4] = boneIndex; sw[i * 4] = 1; }

  for (const pm of partMats) for (let k = 0; k < pm.tris; k++) triMat[t++] = pm.mat;
  triMat = stripDegenerateTriangles(merged, triMat);
  // material groups (parts were sorted by mat, so runs are contiguous)
  merged.clearGroups();
  let s = 0;
  for (let i = 1; i <= triMat.length; i++) {
    if (i === triMat.length || triMat[i] !== triMat[s]) {
      merged.addGroup(s * 3, (i - s) * 3, triMat[s]);
      s = i;
    }
  }
  merged.computeBoundingBox();
  return { geometry: merged, triMat };

function makeMaterials(stage = 5) {
  if (stage < 4) {

    return MATERIALS.map(() => new THREE.MeshStandardMaterial({
      color: 0xcfc8bd, roughness: 0.6, metalness: 0, side: THREE.DoubleSide,
    }));

    new THREE.MeshPhysicalMaterial({
      color: 0xe3d2ba, roughness: 0.5, metalness: 0,
      clearcoat: 0.25, clearcoatRoughness: 0.55,
      sheen: 0.35, sheenRoughness: 0.6, sheenColor: 0xfff2e0,
      side: THREE.DoubleSide,
    }),
    new THREE.MeshPhysicalMaterial({ color: 0x9a7a4a, roughness: 0.3, metalness: 1.0, envMapIntensity: 1.25 }),
    new THREE.MeshStandardMaterial({ color: 0x4a3826, roughness: 0.85, metalness: 0, side: THREE.DoubleSide }),

function buildSkeleton(scale, prefix) {
  const bones = [];
  const byName = new Map();
  for (const j of JOINTS) {
    const b = new THREE.Bone();
    b.name = prefix + j.name;
    const pp = j.parent ? JOINTS[JINDEX.get(j.parent)].pos : [0, 0, 0];
    b.position.set((j.pos[0] - pp[0]) * scale, (j.pos[1] - pp[1]) * scale, (j.pos[2] - pp[2]) * scale);
    // hands twist about the arm axis first, then deviate in the camera plane
    if (j.name.endsWith('Hand')) b.rotation.order = 'ZYX';
    if (j.parent) byName.get(j.parent).add(b);
    bones.push(b);
    byName.set(j.name, b);
  }
  return { bones, root: bones[0] };

      { id: 'palmSocketL', bone: 'LeftHand', use: 'prop grip' },
      { id: 'palmSocketR', bone: 'RightHand', use: 'prop grip' },
      { id: 'soleSocketL', bone: 'LeftFoot', use: 'ground contact' },
      { id: 'soleSocketR', bone: 'RightFoot', use: 'ground contact' },
    ],
  };
  return { group, mesh, bones, root, triMat };
}

/* ============================================================
 * 4b. PART IDENTITY — explode view, part picking, and the
 *     coverage manifest all derive from the same PARTS table,
 *     so "a part" has exactly one definition. Meshes are named
 *     componentId or componentId/featureId (sides suffixed);
 *     surface relief rides its shell via explodeWithParent.
 * ============================================================ */
function partIdentity(part) {
  const side = part.bone.startsWith('Left') ? 'L' : part.bone.startsWith('Right') ? 'R' : '';
  const sid = part.sid || part.bone.toLowerCase();
  const [base, feat] = sid.split('/');
  const component = base + side;
  return { component, name: feat ? `${component}/${feat}${side}` : component, relief: !!part.relief };
}

function buildPartsGroup(stage = 5) {
  const group = new THREE.Group();
  group.name = 'IvoryMannequinParts';
  const mats = makeMaterials(stage);
  for (const part of PARTS) {
    if ((part.stage ?? 1) > stage) continue;
    const id = partIdentity(part);
    const mesh = new THREE.Mesh(partGeometry(part, 1), mats[part.mat]);
    mesh.name = id.name;
    mesh.userData.component = id.component;
    mesh.userData.explodeWithParent = id.relief;
    mesh.castShadow = true;
    group.add(mesh);
  }
  return group;
}

// separate parts by scaling the component layout about the model centre
function explodeParts(group, factor) {
  const centre = new THREE.Vector3(0, 88, 0);
  const centroids = new Map(); // componentId -> centroid of its non-relief meshes
  const box = new THREE.Box3();
  for (const mesh of group.children) {
    if (mesh.userData.explodeWithParent) continue;
    box.setFromObject(mesh);
    const c = box.getCenter(new THREE.Vector3());
    const cur = centroids.get(mesh.userData.component);
    if (cur) cur.add(c).multiplyScalar(0.5);
    else centroids.set(mesh.userData.component, c);
  }
  for (const mesh of group.children) {
    const c = centroids.get(mesh.userData.component);
    if (!c) continue;
    mesh.position.copy(c.clone().sub(centre).multiplyScalar(factor - 1));
  }
}

function partsManifest(stage = 5) {
  const seen = new Map();
  for (const part of PARTS) {
    if ((part.stage ?? 1) > stage) continue;
    const id = partIdentity(part);
    const g = partGeometry(part, 1);
    const rec = seen.get(id.name) || { mesh: id.name, component: id.component,
      relief: id.relief, bones: new Set(), tris: 0 };
    rec.bones.add(part.bone);
    rec.tris += g.index.count / 3;
    seen.set(id.name, rec);
  }
  return [...seen.values()].map(r => ({ ...r, bones: [...r.bones] }));
}

/* ============================================================
 * 5. FBX EXPORT DATA — pulled once from a fresh cm-scale build,
 *    independent of viewer state (the display pose never leaks:
 *    exports rebuild the character in bind pose, full stage).
 * ============================================================ */
function extractFbxData(prefix) {
  const { geometry: g, triMat } = buildBody(1, 5);
  const pos = g.attributes.position, nrm = g.attributes.normal, uv = g.attributes.uv;
  const sIdx = g.attributes.skinIndex;
  const index = g.index.array;
  const nV = pos.count, nT = index.length / 3;

  const verts = new Float64Array(nV * 3);
  verts.set(pos.array.subarray(0, nV * 3));
  const polyIdx = new Int32Array(index.length);
  for (let t = 0; t < nT; t++) {
    polyIdx[t * 3] = index[t * 3];
    polyIdx[t * 3 + 1] = index[t * 3 + 1];
    polyIdx[t * 3 + 2] = -index[t * 3 + 2] - 1; // last index of each polygon is XOR'd
  }
  const normals = new Float64Array(nT * 9);
  for (let c = 0; c < index.length; c++) {
    const v = index[c];
    normals[c * 3] = nrm.getX(v);
    normals[c * 3 + 1] = nrm.getY(v);
    normals[c * 3 + 2] = nrm.getZ(v);
  }
  const uvs = new Float64Array(nV * 2);
  uvs.set(uv.array.subarray(0, nV * 2));
  const uvIndex = Int32Array.from(index);
  const smoothing = new Int32Array(nT).fill(1);

  const clusters = JOINTS.map(() => ({ indexes: [], weights: [] }));
  for (let v = 0; v < nV; v++) {
    clusters[sIdx.getX(v)].indexes.push(v);
    clusters[sIdx.getX(v)].weights.push(1);
  }
  const bones = JOINTS.map(j => {
    const pp = j.parent ? JOINTS[JINDEX.get(j.parent)].pos : [0, 0, 0];
    return {
      name: prefix + j.name,
      parent: j.parent ? JINDEX.get(j.parent) : -1,
      local: [j.pos[0] - pp[0], j.pos[1] - pp[1], j.pos[2] - pp[2]],
      world: j.pos.slice(),
    };
  });
  return { verts, polyIdx, normals, uvs, uvIndex, smoothing, triMat, clusters, bones, nV, nT };
}

function lintFbxData(d) {
  const errs = [];
  if (d.normals.length !== d.nT * 9) errs.push(`normals length ${d.normals.length} != 9*tris ${d.nT * 9}`);
  if (d.smoothing.length !== d.nT) errs.push('smoothing length != tri count');
  if (d.triMat.length !== d.nT) errs.push('material map length != tri count');
  for (let t = 0; t < d.nT; t++) {
    if (d.triMat[t] < 0 || d.triMat[t] >= MATERIALS.length) { errs.push('material index out of range'); break; }
  }
  if (d.uvIndex.length !== d.nT * 3) errs.push('uvIndex length != corner count');
  for (let t = 0; t < d.nT; t++) {
    if (d.polyIdx[t * 3 + 2] >= 0) { errs.push(`tri ${t}: last index not negative`); break; }
  }
  let weighted = 0;
  for (const cl of d.clusters) {
    weighted += cl.indexes.length;
    if (cl.indexes.length === 0) errs.push('bone with no skinned vertices');
    if (cl.indexes.length !== cl.weights.length) errs.push('cluster indexes/weights length mismatch');
    for (const w of cl.weights) if (w !== 1) { errs.push('non-rigid weight found'); break; }
    for (const i of cl.indexes) if (i < 0 || i >= d.nV) { errs.push('cluster index out of range'); break; }
  }
  if (weighted !== d.nV) errs.push(`weighted vertices ${weighted} != vertex count ${d.nV} (each vertex must be in exactly one cluster)`);
  d.bones.forEach((b, i) => { if (b.parent >= i) errs.push(`bone ${b.name}: parent after child`); });
  for (const arr of [d.verts, d.normals]) {
    for (let i = 0; i < arr.length; i++) if (!Number.isFinite(arr[i])) { errs.push('non-finite value in geometry'); break; }
  }
  if (d.nT >= 9000) errs.push(`triangle budget exceeded: ${d.nT}`);
  return errs;
}

/* ============================================================

        P('FrontAxisSign', 'int', 'Integer', '', I(1)),
        P('CoordAxis', 'int', 'Integer', '', I(0)),
        P('CoordAxisSign', 'int', 'Integer', '', I(1)),
        P('OriginalUpAxis', 'int', 'Integer', '', I(1)),
        P('OriginalUpAxisSign', 'int', 'Integer', '', I(1)),

        P('OriginalUnitScaleFactor', 'double', 'Number', '', D(1)),

        P70(
          P('SourceObject', 'object', '', ''),
          P('ActiveAnimStackName', 'KString', '', '', S('')),

    ]),

    N('Definitions', [], [
      N('Version', [I(100)]),
      N('Count', [I(total)]),
      ...Object.entries(counts).map(([k, v]) => N('ObjectType', [S(k)], [N('Count', [I(v)])])),
    ]),
    N('Objects', [], [geometry, ...models, ...nodeAttrs, ...materials, skin, ...clusters, pose]),

}

/* ============================================================
 * 7. ASCII SERIALIZER (FBX 7.4)
 * ============================================================ */
function fbxNum(v) {
  if (typeof v === 'bigint') return v.toString();
  if (Number.isInteger(v)) return String(v);
  let s = v.toFixed(6).replace(/(\.\d*?)0+$/, '$1').replace(/\.$/, '');
  return s === '-0' ? '0' : s;
}
function asciiProp(p) {
  switch (p.t) {
    case 'I': case 'L': return String(p.v);
    case 'D': return fbxNum(p.v);
    case 'S': return '"' + p.v + '"';
    case 'C': return p.v ? 'T' : 'W';
  }
}
function serializeFbxAscii(roots) {
  const out = [
    '; FBX 7.4.0 project file',
    '; Generated by ' + CREATOR,
    '; ----------------------------------------------------',
    '',
  ];
  const emit = (node, depth) => {
    if (node.only === 'binary') return;
    const ind = '\t'.repeat(depth);
    if (node.props.length === 1 && (node.props[0].t === 'd' || node.props[0].t === 'i')) {
      const a = node.props[0].v;
      out.push(`${ind}${node.name}: *${a.length} {`);
      const lines = [];
      let buf = '';
      for (let i = 0; i < a.length; i++) {
        const tok = (buf ? ',' : '') + fbxNum(a[i]);
        if (buf.length + tok.length > 1800) { lines.push(buf + ','); buf = fbxNum(a[i]); }
        else buf += tok;
      }
      lines.push(buf);
      out.push(ind + '\ta: ' + lines[0]);
      for (let k = 1; k < lines.length; k++) out.push(lines[k]);
      out.push(ind + '}');
      return;
    }
    const ps = node.props.map(asciiProp).join(', ');
    if (node.children.length > 0 || node.props.length === 0) {
      out.push(`${ind}${node.name}:${ps ? ' ' + ps : ' '} {`);
      for (const c of node.children) emit(c, depth + 1);
      out.push(ind + '}');
    } else {
      out.push(`${ind}${node.name}: ${ps}`);
    }
  };
  for (const r of roots) {
    emit(r, 0);
    out.push('');
  }
  return out.join('\n');
}

/* ============================================================
 * 8. BINARY SERIALIZER (FBX 7.4, uncompressed arrays)
 * ============================================================ */
class BinWriter {
  constructor() { this.buf = new ArrayBuffer(1 << 20); this.dv = new DataView(this.buf); this.len = 0; }
  ensure(n) {
    while (this.len + n > this.buf.byteLength) {
      const nb = new ArrayBuffer(this.buf.byteLength * 2);
      new Uint8Array(nb).set(new Uint8Array(this.buf, 0, this.len));
      this.buf = nb; this.dv = new DataView(nb);

  u8(v) { this.ensure(1); this.dv.setUint8(this.len, v); this.len += 1; }
  u32(v) { this.ensure(4); this.dv.setUint32(this.len, v, true); this.len += 4; }
  i32(v) { this.ensure(4); this.dv.setInt32(this.len, v, true); this.len += 4; }
  i64(v) { this.ensure(8); this.dv.setBigInt64(this.len, BigInt(v), true); this.len += 8; }
  f64(v) { this.ensure(8); this.dv.setFloat64(this.len, v, true); this.len += 8; }
  zeros(n) { this.ensure(n); this.len += n; } // buffer starts zeroed
  bytes(arr) { this.ensure(arr.length); new Uint8Array(this.buf).set(arr, this.len); this.len += arr.length; }
  str(s) { this.bytes(new TextEncoder().encode(s)); }

  w.u8(nameB.length); w.bytes(nameB);
  const propsStart = w.len;
  for (const p of node.props) writeBinProp(w, p);
  const propListLen = w.len - propsStart;
  const kids = node.children.filter(c => c.only !== 'ascii');
  if (kids.length > 0 || node.props.length === 0) {
    for (const c of kids) writeBinNode(w, c);
    w.zeros(13); // null-record sentinel (13 bytes for version < 7500)
  }
  w.patchU32(start, w.len);
  w.patchU32(start + 4, node.props.length);
  w.patchU32(start + 8, propListLen);
}
function serializeFbxBinary(roots) {
  const w = new BinWriter();
  w.str('Kaydara FBX Binary  '); w.u8(0); w.u8(0x1a); w.u8(0);
  w.u32(7400);
  for (const r of roots) writeBinNode(w, r);
  w.zeros(13);
  // Footer recipe as written by the official SDK (and Blender's exporter).
  w.bytes(Uint8Array.from([0xfa, 0xbc, 0xab, 0x09, 0xd0, 0xc8, 0xd4, 0x66, 0xb1, 0x76, 0xfb, 0x83, 0x1c, 0xf7, 0x26, 0x7e]));
  w.zeros(4);
  let pad = ((w.len + 15) & ~15) - w.len;
  if (pad === 0) pad = 16;
  w.zeros(pad);
  w.u32(7400);
  w.zeros(120);
  w.bytes(Uint8Array.from([0xf8, 0x5a, 0x8c, 0x6a, 0xde, 0xf5, 0xd9, 0x7e, 0xec, 0xe9, 0x0c, 0xe3, 0x75, 0x8f, 0x29, 0x0b]));
  return w.toUint8();
}

/* ============================================================
 * 9. EXPORT ENTRY POINTS
 * ============================================================ */
function currentPrefix() { return ui.prefix.checked ? 'mixamorig:' : ''; }

function generateFbx(kind) {
  const data = extractFbxData(currentPrefix());
  const errs = lintFbxData(data);
  if (errs.length) throw new Error('FBX lint failed:\n' + errs.join('\n'));
  const roots = buildFbxDoc(data);
  return kind === 'ascii' ? serializeFbxAscii(roots) : serializeFbxBinary(roots);
}

function generateGlb() {
  const { group } = buildCharacter(0.01, currentPrefix()); // glTF is meters
  const exporter = new GLTFExporter();
  return new Promise((resolve, reject) => exporter.parse(group, resolve, reject, { binary: true }));
}

function download(filename, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* ============================================================
 * 10. VALIDATION — re-import our own output with three.js
 *     loaders. Necessary, not sufficient: FBXLoader ignores
 *     Documents/Definitions/GlobalSettings, so DCC-level checks
 *     live in verify/blender_check.py.
 * ============================================================ */
function inspectImported(root) {
  const boneNames = [];
  const smeshes = [];
  root.traverse(o => {
    if (o.isBone) boneNames.push(o.name);
    if (o.isSkinnedMesh) smeshes.push(o);
  });
  let height = NaN, vertices = 0;
  const mats = new Set();
  let minY = Infinity, maxY = -Infinity;
  for (const m of smeshes) {
    // Raw attribute bounds — SkinnedMesh bounding paths need a rendered
    // skeleton update, which these throwaway re-imports never get.
    m.geometry.computeBoundingBox();
    minY = Math.min(minY, m.geometry.boundingBox.min.y);
    maxY = Math.max(maxY, m.geometry.boundingBox.max.y);
    vertices += m.geometry.attributes.position.count;
    (Array.isArray(m.material) ? m.material : [m.material]).forEach(x => mats.add(x.uuid));
  }
  if (smeshes.length) height = maxY - minY;
  return {
    boneNames,
    skinned: smeshes.length > 0,
    skeletonSize: smeshes.length ? smeshes[0].skeleton.bones.length : 0,
    vertices,
    materials: mats.size,
    height,
  };
}

let validationRun = 0;
async function runValidation() {
  const runId = ++validationRun; // last-started run owns the UI
  const badge = document.getElementById('badge');
  const report = document.getElementById('report');
  badge.className = 'wait';
  badge.textContent = 'VALIDATING…';
  const lines = [];
  let ok = true;
  const check = (cond, msg) => { lines.push((cond ? 'ok   ' : 'FAIL ') + msg); if (!cond) ok = false; };
  const prefix = currentPrefix();
  const expected = new Set(JOINTS.map(j => prefix + j.name));
  try {
    const data = extractFbxData(prefix);
    const lintErrs = lintFbxData(data);
    check(lintErrs.length === 0, 'lint: ' + (lintErrs.length ? lintErrs.join('; ') : 'geometry, weights, materials, hierarchy'));
    let bindMinY = Infinity, bindMaxY = -Infinity;
    for (let i = 1; i < data.verts.length; i += 3) {
      bindMinY = Math.min(bindMinY, data.verts[i]);
      bindMaxY = Math.max(bindMaxY, data.verts[i]);
    }
    const bindH = bindMaxY - bindMinY;

    const ascii = generateFbx('ascii');
    const bin = generateFbx('binary');
    const loader = new FBXLoader();
    const asciiBuf = new TextEncoder().encode(ascii).buffer;
    let rA = null, rB = null;
    try { rA = inspectImported(loader.parse(asciiBuf, '')); } catch (e) { check(false, 'FBX ASCII re-import threw: ' + e.message); }
    try { rB = inspectImported(loader.parse(bin.buffer.slice(bin.byteOffset, bin.byteOffset + bin.byteLength), '')); } catch (e) { check(false, 'FBX binary re-import threw: ' + e.message); }
    for (const [tag, r] of [['ascii', rA], ['binary', rB]]) {
      if (!r) continue;
      check(r.skinned, `${tag}: SkinnedMesh present`);
      check(r.boneNames.length === JOINTS.length, `${tag}: ${r.boneNames.length}/${JOINTS.length} bones`);
      check(r.skeletonSize === JOINTS.length, `${tag}: skeleton binds ${r.skeletonSize} bones`);
      check(r.boneNames.every(n => expected.has(n)), `${tag}: Mixamo name set`);
      check(r.vertices === data.nT * 3, `${tag}: ${r.vertices} polygon vertices (expect ${data.nT * 3})`);
      check(r.materials === MATERIALS.length, `${tag}: ${r.materials} material slots`);
      check(Math.abs(r.height - bindH) < 1, `${tag}: height ${r.height.toFixed(1)} cm (bind ${bindH.toFixed(1)})`);
    }
    if (rA && rB) {
      check(rA.boneNames.join() === rB.boneNames.join() && rA.vertices === rB.vertices,
        'ascii/binary round-trips agree');
    }
    const glbBuf = await generateGlb();
    const gltf = await new Promise((res, rej) => new GLTFLoader().parse(glbBuf, '', res, rej));
    const rG = inspectImported(gltf.scene);
    check(rG.skinned && rG.boneNames.length === JOINTS.length, `glb: skinned, ${rG.boneNames.length} bones`);
    check(rG.materials === MATERIALS.length, `glb: ${rG.materials} materials`);
    check(Math.abs(rG.height - bindH * 0.01) < 0.02, `glb: height ${rG.height.toFixed(2)} m`);
  } catch (e) {
    check(false, 'exception: ' + e.message);
    console.error(e);
  }
  if (runId !== validationRun) return;
  badge.className = ok ? 'ok' : 'fail';
  badge.textContent = ok ? 'ROUND-TRIP PASS' : 'ROUND-TRIP FAIL';
  report.textContent = lines.join('\n');
}

/* ============================================================
 * 11. VIEWER — soft blue-gray studio matching the reference
 *     plate; reference A-pose is viewer-only (bind untouched).
 * ============================================================ */
const ui = {
  stance: document.getElementById('cb-stance'),
  wire: document.getElementById('cb-wire'),
  skel: document.getElementById('cb-skel'),
  labels: document.getElementById('cb-labels'),
  prefix: document.getElementById('cb-prefix'),
};

const wrap = document.getElementById('viewport');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(REVIEW ? 1 : Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = STAGE >= 5 ? 0.95 : 1.0;
wrap.appendChild(renderer.domElement);
const labelRenderer = new CSS2DRenderer();
labelRenderer.domElement.id = 'labels';
wrap.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
// backdrop: vertical blue-gray gradient like the reference plate
function gradientTexture(stops) {
  const cv = document.createElement('canvas');
  cv.width = 2; cv.height = 512;
  const ctx = cv.getContext('2d');
  const gr = ctx.createLinearGradient(0, 0, 0, 512);
  for (const [t, c] of stops) gr.addColorStop(t, c);
  ctx.fillStyle = gr;
  ctx.fillRect(0, 0, 2, 512);
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const FINAL_LIGHTING = STAGE >= 5;
scene.background = FINAL_LIGHTING
  ? gradientTexture([[0, '#5e7b86'], [0.5, '#75919a'], [0.78, '#89a0a1'], [1, '#a7b1a8']])
  : new THREE.Color(0xf2f3f5);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = FINAL_LIGHTING ? 0.34 : 0.55;
if (FINAL_LIGHTING) {
  // gradient wall behind the figure: the cove junction reads at shin height
  const wall = new THREE.Mesh(
    new THREE.PlaneGeometry(6000, 1400),
    new THREE.MeshBasicMaterial({ map: gradientTexture(
      [[0, '#4e6b76'], [0.68, '#587680'], [0.78, '#6d8992'], [0.9, '#87999b'], [1, '#c2c8c0']]) }),
  );
  wall.position.set(0, 700, -320);
  scene.add(wall);
}

const camera = new THREE.PerspectiveCamera(REVIEW ? 24 : 32, 1, 1, 5000);
camera.position.set(170, 122, 300);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 88, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;

const key = new THREE.DirectionalLight(FINAL_LIGHTING ? 0xffeccd : 0xffffff, FINAL_LIGHTING ? 2.2 : 1.9);
key.position.set(FINAL_LIGHTING ? 170 : 140, FINAL_LIGHTING ? 560 : 380, FINAL_LIGHTING ? 330 : 260);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -160; key.shadow.camera.right = 160;
key.shadow.camera.top = 220; key.shadow.camera.bottom = -60;
key.shadow.camera.far = 900;
key.shadow.bias = -0.0002;
key.shadow.radius = FINAL_LIGHTING ? 9 : 6;
scene.add(key);
const fill = new THREE.DirectionalLight(0xc9dade, FINAL_LIGHTING ? 0.38 : 0.55);
fill.position.set(-260, 180, 140);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xdfeaee, FINAL_LIGHTING ? 0.45 : 0.7);
rim.position.set(-120, 300, -240);
scene.add(rim);
scene.add(new THREE.HemisphereLight(0x9db0b5, 0x9b8668, FINAL_LIGHTING ? 0.72 : 0.35));

const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(6000, 6000),
  FINAL_LIGHTING
    ? new THREE.MeshBasicMaterial({ color: 0xc2c8c0 }) // unlit: seamless cove into the wall base
    : new THREE.MeshStandardMaterial({ color: 0xe8e9eb, roughness: 0.95, metalness: 0 }),
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = !FINAL_LIGHTING && !(REVIEW && STAGE < 5); // shadow lives on the catcher in the final plate
scene.add(ground);
const shadowCatcher = new THREE.Mesh(
  new THREE.PlaneGeometry(2400, 2400),
  new THREE.ShadowMaterial({ opacity: 0.22 }),
);
shadowCatcher.rotation.x = -Math.PI / 2;
shadowCatcher.position.y = 0.05;
shadowCatcher.receiveShadow = true;
// clay-pass review captures need clean masks — no shadow band
shadowCatcher.visible = !(REVIEW && STAGE < 5);
scene.add(shadowCatcher);
const grid = new THREE.GridHelper(400, 40, 0x8fa0a4, 0xa8b6b8);
grid.position.y = 0.08;
grid.visible = !REVIEW && !FINAL_LIGHTING;
scene.add(grid);

const character = buildCharacter(1, '', STAGE);
scene.add(character.group);
const boneByName = new Map(character.bones.map(b => [b.name, b]));

/* explode / part-picking mode: ?explode=1.6 swaps the skinned mesh for the
 * named parts group (same PARTS table, T-pose) and enables click picking */
const EXPLODE = parseFloat(PARAMS.get('explode') || '0');
let partsGroup = null;
if (EXPLODE > 0) {
  character.group.visible = false;
  partsGroup = buildPartsGroup(STAGE);
  explodeParts(partsGroup, EXPLODE);
  scene.add(partsGroup);
  const hud = document.createElement('div');
  hud.style.cssText = 'position:absolute;left:10px;top:10px;z-index:8;font:12px ui-monospace;' +
    'background:rgba(255,255,255,.9);border:1px solid #ccc;border-radius:4px;padding:4px 8px;';
  hud.textContent = `explode ×${EXPLODE} — click a part`;
  wrap.appendChild(hud);
  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  renderer.domElement.addEventListener('pointerdown', e => {
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    const hit = ray.intersectObjects(partsGroup.children, false)[0];
    hud.textContent = hit ? `${hit.object.name}  (component ${hit.object.userData.component})` : 'no part hit';
  });
}

/* reference A-pose — viewer-only pose on top of the T-pose bind.
 * Angles measured from the plate: arm chain 36.7°/46.4° from
 * vertical, hands twisted dorsal-to-camera, fingers fanned +
 * relax-curled, legs converging hip x8.3 → ankle x4.1. */
const STANCE_POSE = (() => {
  const p = {};
  const set = (n, x, y, z) => { p[n] = [x, y, z]; };
  for (const [S, s] of [['Left', 1], ['Right', -1]]) {
    set(S + 'Arm', 0, 0, s * -0.885);
    set(S + 'ForeArm', 0, 0, s * 0.066); // elbow bends outward: forearm less steep than upper arm
    set(S + 'Hand', 1.35, s * -0.06, s * 0.60);
    const fan = { Index: -0.31, Middle: -0.07, Ring: 0.16, Pinky: 0.39 };
    for (const f of ['Index', 'Middle', 'Ring', 'Pinky']) {
      set(S + 'Hand' + f + '1', 0, s * fan[f], s * -0.10);
      set(S + 'Hand' + f + '2', 0, 0, s * -0.12);
      set(S + 'Hand' + f + '3', 0, 0, s * -0.10);
    }
    set(S + 'HandThumb1', 0.12, s * -0.12, s * -0.34);
    set(S + 'HandThumb2', 0, s * -0.14, s * -0.16);
    set(S + 'HandThumb3', 0, s * -0.1, 0);
    set(S + 'UpLeg', 0, 0, s * -0.042);
    set(S + 'Leg', 0, 0, s * -0.031);
    set(S + 'Foot', 0, 0, s * 0.073);
  }
  return p;
})();

function applyStance(on) {
  for (const b of character.bones) {
    const r = on ? STANCE_POSE[b.name] : null;
    if (r) b.rotation.set(r[0], r[1], r[2]);
    else b.rotation.set(0, 0, 0);
  }
  character.group.updateMatrixWorld(true);
  refreshDots();
}

const skelHelper = new THREE.SkeletonHelper(character.root);
scene.add(skelHelper);
const dotArr = new Float32Array(JOINTS.length * 3);
const dotGeo = new THREE.BufferGeometry();
dotGeo.setAttribute('position', new THREE.BufferAttribute(dotArr, 3));
const dots = new THREE.Points(dotGeo, new THREE.PointsMaterial({
  color: 0x2b6cff, size: 2.2, sizeAttenuation: true, depthTest: false,
}));
dots.renderOrder = 999;
scene.add(dots);
function refreshDots() {
  const v = new THREE.Vector3();
  character.bones.forEach((b, i) => {
    b.getWorldPosition(v);
    dotArr[i * 3] = v.x; dotArr[i * 3 + 1] = v.y; dotArr[i * 3 + 2] = v.z;
  });
  dotGeo.attributes.position.needsUpdate = true;
  dotGeo.computeBoundingSphere();
}

for (const bone of character.bones) {
  const div = document.createElement('div');
  div.className = 'jlabel';
  div.textContent = bone.name;
  bone.add(new CSS2DObject(div));
}

const syncStance = () => applyStance(ui.stance.checked);
const syncWire = () => { for (const m of character.mesh.material) m.wireframe = ui.wire.checked; };
const syncSkel = () => { skelHelper.visible = dots.visible = ui.skel.checked; };
const syncLabels = () => { labelRenderer.domElement.style.visibility = ui.labels.checked ? 'visible' : 'hidden'; };
ui.stance.addEventListener('change', syncStance);
ui.wire.addEventListener('change', syncWire);
ui.skel.addEventListener('change', syncSkel);
ui.labels.addEventListener('change', syncLabels);
// Sync once at startup — browsers may restore checkbox state across reloads.
syncStance(); syncWire(); syncSkel(); syncLabels();

/* review mode: fixed reference-matched framings for the sculpt loop */
if (REVIEW) {
  document.body.classList.add('review');
  ui.skel.checked = false; ui.labels.checked = false; ui.wire.checked = false;
  ui.stance.checked = true;
  syncStance(); syncWire(); syncSkel(); syncLabels();
  skelHelper.visible = dots.visible = false;
  const views = {
    front: { pos: [0, 122, 478], tgt: [0, 88.5, 0] },
    tq: { pos: [310, 135, 375], tgt: [0, 88.5, 0] },
    profile: { pos: [478, 122, 0], tgt: [0, 88.5, 0] },
    hands: { pos: [30, 82, 132], tgt: [56, 95, 1] },
    head: { pos: [0, 158, 130], tgt: [0, 160, 0] },
  };
  const v = views[REVIEW] || views.front;
  camera.position.set(...v.pos);
  controls.target.set(...v.tgt);
  controls.update();
}

function exportButton(id, fn) {
  const btn = document.getElementById(id);
  btn.addEventListener('click', async () => {
    if (btn.disabled) return;
    btn.disabled = true;
    try { await fn(); } finally { btn.disabled = false; }
  });
}
exportButton('btn-ascii', () => {
  download('mannequin-ascii.fbx', new Blob([generateFbx('ascii')], { type: 'text/plain' }));
});
exportButton('btn-bin', () => {
  download('mannequin-binary.fbx', new Blob([generateFbx('binary')], { type: 'application/octet-stream' }));
});
exportButton('btn-glb', async () => {
  download('mannequin.glb', new Blob([await generateGlb()], { type: 'model/gltf-binary' }));
});
document.getElementById('btn-validate').addEventListener('click', runValidation);
ui.prefix.addEventListener('change', runValidation);

/* readouts */
{
  const g = character.mesh.geometry;
  const tris = g.index.count / 3;
  document.getElementById('stat-joints').textContent = JOINTS.length;
  document.getElementById('stat-tris').textContent = tris.toLocaleString();
  const bbox = g.boundingBox;
  document.getElementById('stat-height').textContent = (bbox.max.y - bbox.min.y).toFixed(0);
  console.info(`[mannequin] stage ${STAGE}: ${JOINTS.length} joints, ${tris} triangles, ` +
    `${g.attributes.position.count} vertices, height ${(bbox.max.y - bbox.min.y).toFixed(1)} cm, ` +
    `${g.groups.length} material groups`);
  if (tris >= 9000) console.warn('[mannequin] triangle budget exceeded');
}

/* hierarchy tree — finger chains collapsed by default */
{
  const kids = new Map(JOINTS.map(j => [j.name, []]));
  for (const j of JOINTS) if (j.parent) kids.get(j.parent).push(j.name);
  const isFinger = n => /Hand(Thumb|Index|Middle|Ring|Pinky)/.test(n);
  const build = name => {
    const c = kids.get(name);
    if (!c.length) {
      const div = document.createElement('div');
      div.className = 'leaf';
      div.textContent = name;
      return div;
    }
    const det = document.createElement('details');
    det.open = !isFinger(name);
    const sum = document.createElement('summary');
    sum.textContent = name;
    det.appendChild(sum);
    for (const n of c) det.appendChild(build(n));
    return det;
  };
  document.getElementById('tree').appendChild(build('Hips'));
}

/* resize + loop */
function resize() {
  let w = wrap.clientWidth, h = wrap.clientHeight;
  if (REVIEW) { // reference aspect 0.753 for comparable capture framing
    const target = 0.7532;
    if (w / h > target) w = Math.round(h * target);
    else h = Math.round(w / target);
  }
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(wrap);
resize();
renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});

/* exposed for debugging + headless automation */
window.__mannequin = {
  THREE, character, buildCharacter, extractFbxData, generateFbx, generateGlb,
  runValidation, applyStance, JOINTS, PARTS, MATERIALS, STAGE,
  renderer, scene, camera, controls, buildPartsGroup, partsManifest, explodeParts,
  // synchronous render + read-back (multisampled buffers resolve stale otherwise)
  capture(name, port = 8766) {
    renderer.render(scene, camera);
    return fetch(`http://localhost:${port}/save?name=${name}`, {
      method: 'POST', body: renderer.domElement.toDataURL('image/png'),
    }).then(r => r.text());
  },
};

if (!REVIEW) runValidation();
